# Builds the Windows app and publishes a GitHub Release when a version tag is pushed.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The tag must match the app version in build/config.yml, build/windows/info.json and
# build/windows/nsis/wails_tools.nsh (see "Releasing" in the README). Toolchain versions follow docs/adr/0001-pinned-toolchain.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload files

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $config = (Select-String -Path build/config.yml -Pattern '^\s+version:\s*"([^"]+)"').Matches[0].Groups[1].Value
          $info = (Get-Content build/windows/info.json -Raw | ConvertFrom-Json).fixed.product_version
          $nsis = (Select-String -Path build/windows/nsis/wails_tools.nsh -Pattern 'INFO_PRODUCTVERSION "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $config -or $tag -ne $info -or $tag -ne $nsis) {
            Write-Error "Tag $tag does not match build/config.yml ($config), build/windows/info.json ($info) and build/windows/nsis/wails_tools.nsh ($nsis)."
            exit 1
          }

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install NSIS
        run: |
          choco install nsis --version=3.13 -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test
        run: go test ./internal/...

      - name: Build installer
        run: wails3 package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            bin/somanygames-amd64-installer.exe `
            bin/somanygames.exe `
            --title "So Many Games ${{ github.ref_name }}" `
            --generate-notes
